[program:queue-worker]
command=/usr/local/bin/php /app/artisan queue:work --sleep=3 --tries=3 --timeout=60
directory=/app
user=application
autostart=true
autorestart=true
startsecs=3
startretries=100
stopsignal=TERM
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
